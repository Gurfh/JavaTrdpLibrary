name: CI Build and Test

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java: [ '25' ]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean compile
    
    - name: Run unit tests
      run: mvn test
    
    - name: Install tshark for wire-format compliance tests
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
        sudo setcap cap_net_raw,cap_net_admin+ep $(which dumpcap)

    - name: Run integration tests
      run: mvn verify
    
    - name: Generate test coverage report
      run: mvn jacoco:report
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      if: matrix.java == '25'
      with:
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-trdp
        fail_ci_if_error: false
    
    - name: Build JAR artifact
      run: mvn package -DskipTests
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      if: matrix.java == '25'
      with:
        name: trdp-protocol-jar
        path: target/*.jar
